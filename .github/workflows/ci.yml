name: CI

on:
  pull_request:
  push:
    branches: [mainline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      # Only the dev group is needed; ruff does not import the package.
      - name: Install dependencies
        run: uv sync --locked --only-group dev

      - name: Run ruff
        run: make lint-ci

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups --reinstall-package clientx

      - name: Run pyright
        run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --reinstall-package clientx: uv_build does not install the project in
      # editable mode, so a cached wheel from a previous run can shadow src/.
      - name: Install dependencies
        run: uv sync --locked --all-groups --reinstall-package clientx

      - name: Run tests
        run: make test-ci
