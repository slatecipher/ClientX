name: CI

on:
  pull_request:
  push:
    branches: [mainline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      # Only the dev group is needed; ruff does not import the package.
      - name: Install dependencies
        run: uv sync --locked --only-group dev

      - name: Run ruff
        run: make lint-ci

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups --reinstall-package clientx

      - name: Run pyright
        run: make typecheck

      # Advisory only. Test-suite type errors are surfaced as a failed step
      # annotation but must not gate a merge, so the job stays green.
      - name: Run pyright over tests (non-blocking)
        continue-on-error: true
        run: make typecheck-tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --reinstall-package clientx: uv_build does not install the project in
      # editable mode, so a cached wheel from a previous run can shadow src/.
      - name: Install dependencies
        run: uv sync --locked --all-groups --reinstall-package clientx

      - name: Run tests
        run: make test-ci

  # Merge Dependabot patch/minor updates once all jobs pass; majors need manual review.
  dependabot-auto-merge:
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # update-type is the largest change in the PR, so a grouped update with
      # one major bump is left for review as a whole.
      - name: Merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
