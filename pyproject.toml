[project]
name = "clientx"
version = "0.1.0"
description = "A typed, declarative HTTP API client framework for Python"
readme = "README.md"
authors = [
    { name = "slatecipher", email = "25094255+slatecipher@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["http", "api", "client", "httpx", "httpx2", "pydantic", "typed", "declarative", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.10.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
# Serve a client as an MCP server: `pip install "clientx[mcp]"`.
mcp = ["mcp>=2.3,<3"]

[project.urls]
Repository = "https://github.com/slatecipher/ClientX"
Issues = "https://github.com/slatecipher/ClientX/issues"
Changelog = "https://github.com/slatecipher/ClientX/blob/mainline/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest]
addopts = ["--import-mode=importlib", "-vv", "--cov=clientx", "--cov-report=term-missing"]
# All of pytest's strictness checks. pytest may add more in a release; uv.lock pins it,
# so a new one shows up in the Dependabot PR that upgrades pytest, not on mainline.
strict = true

[tool.pyright]
# Editors check both trees. CI splits them: `make typecheck` passes `src` on the
# command line (which overrides this list) and gates the build, while
# `make typecheck-tests` covers `test` as a non-blocking report.
include = ["src", "test", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# The shipped package is held to strict mode; tests stay on standard.
strict = ["src"]
