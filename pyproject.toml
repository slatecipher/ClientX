[project]
name = "clientx"
version = "0.9.0"
description = "A typed, declarative HTTP API client framework for Python"
readme = "README.md"
authors = [
    { name = "slatecipher", email = "25094255+slatecipher@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["http", "api", "client", "httpx", "pydantic", "typed", "declarative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.10.0",
    "pydantic>=2.12.5",
]

[project.urls]
Repository = "https://github.com/slatecipher/ClientX"
Issues = "https://github.com/slatecipher/ClientX/issues"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
addopts = "-vv --cov=clientx --cov-report=term-missing"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
# "strict" currently reports 46 findings; revisit as a separate cleanup.
typeCheckingMode = "standard"
