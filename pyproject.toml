[project]
name = "clientx"
version = "0.6.0"
description = "A typed, declarative HTTP API client framework for Python"
readme = "README.md"
authors = [
    { name = "slatecipher", email = "25094255+slatecipher@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["http", "api", "client", "httpx", "httpx2", "pydantic", "typed", "declarative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.10.0",
    "pydantic>=2.12.5",
    # Imported directly. Each Pydantic release pins one version: 2.12.5 pins 2.41.5.
    "pydantic-core>=2.41.5",
]

[project.optional-dependencies]
# `clientx.fastmcp`: serve a client's tools with FastMCP. `anyio` runs a sync
# client's tool in a worker thread; its floor is httpx2 2.10.0's.
fastmcp = ["fastmcp>=4.2.0,<5", "anyio>=4.10"]

[project.urls]
Repository = "https://github.com/slatecipher/ClientX"
Documentation = "https://github.com/slatecipher/ClientX/tree/mainline/docs"
Issues = "https://github.com/slatecipher/ClientX/issues"
Changelog = "https://github.com/slatecipher/ClientX/blob/mainline/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastmcp>=4.2.0",
    "mypy>=2.4.1",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest]
addopts = ["--import-mode=importlib", "-vv", "--cov=clientx", "--cov-report=term-missing"]
# All of pytest's strictness checks. pytest may add more in a release; uv.lock pins it,
# so a new one shows up in the Dependabot PR that upgrades pytest, not on mainline.
strict = true

[tool.pyright]
# Editors check every tree. CI splits them: `make typecheck` passes `src`,
# `docs_src` and `scripts` on the command line (which overrides this list) and
# gates the build, while `make typecheck-tests` covers `test` as a non-blocking
# report.
include = ["src", "test", "docs_src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# The shipped package, the docs' samples and scripts are held to strict mode;
# tests stay on standard.
strict = ["src", "docs_src", "scripts"]
# Pyright reads only `# pyright: ignore[...]` comments, and mypy only `# type: ignore[...]`.
# test/test_typing.py marks each expected error for both checkers, and each checker reports
# its own comment if it's unused, which it couldn't if pyright also honoured mypy's.
enableTypeIgnoreComments = false

[tool.mypy]
# mypy checks only the typing contract, the file that pins what type checkers see of
# decorated endpoints, so mypy users get the same guarantees as pyright users. `make
# typecheck` runs it, which gates CI. strict mode includes warn_unused_ignores (an
# expected error that disappears is reported) and check_untyped_defs.
files = ["test/test_typing.py"]
python_version = "3.12"
strict = true
