line-length = 120
target-version = "py312"

[lint]
preview = true
select = ["A", "E3", "E4", "E5", "E7", "E9", "F", "UP", "B", "S", "I", "N", "C90", "C4", "BLE"]

fixable = ["ALL"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
"test/**" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"