line-length = 120
target-version = "py312"

[lint]
preview = true
select = ["A", "D", "E3", "E4", "E5", "E7", "E9", "F", "UP", "B", "S", "I", "N", "C90", "C4", "BLE"]

fixable = ["ALL"]

[lint.per-file-ignores]
"test/**" = ["D", "S101", "S105"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"